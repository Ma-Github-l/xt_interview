# ==================== Application Config ====================
spring.application.name=xt_interview
# Default profile: dev (local); production: -Dspring.profiles.active=prod
spring.profiles.active=dev

# ==================== Database ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Override via env vars in production: XT_DB_URL / XT_DB_USER / XT_DB_PASS
spring.datasource.url=${XT_DB_URL:jdbc:mysql://localhost:3306/xt_interview?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${XT_DB_USER:root}
spring.datasource.password=${XT_DB_PASS:root}

# ==================== HikariCP Connection Pool ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==================== JPA (Flyway manages schema) ====================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# ==================== Flyway Migration ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffix=.sql
spring.flyway.encoding=UTF-8
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ==================== Logging ====================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.flywaydb=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==================== Server ====================
server.port=8080

# ==================== JSON Date Format ====================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ==================== JWT Security ====================
# Production: set XT_JWT_SECRET env var (openssl rand -base64 48)
jwt.secret=${XT_JWT_SECRET:xt-interview-secret-key-for-jwt-token-generation-2026}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000
jwt.header=Authorization
jwt.token-prefix=Bearer
# Grace period: old refresh token can be reused once within 60s if response lost
jwt.refresh-grace-period=60000

# ==================== Avatar Upload Directory ====================
app.upload-dir=./uploads/avatars

# ==================== File Upload Limits (1MB/file, 10MB/request) ====================
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

# ==================== CORS (set XT_CORS_ORIGINS in production) ====================
app.cors-origins=${XT_CORS_ORIGINS:*}
