# Development environment

# Local dev database
spring.datasource.url=jdbc:mysql://localhost:3306/xt_interview?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Verbose SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
logging.level.org.hibernate.SQL=DEBUG

# Skip Flyway checksum validation (local DB may be reset)
spring.flyway.validate-on-migrate=false

# No static resource caching
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-store=true

# Embedded Tomcat threads
server.tomcat.threads.min-spare=4