# Production environment

# Database: set XT_DB_URL / XT_DB_USER / XT_DB_PASS env vars
spring.datasource.url=${XT_DB_URL:jdbc:mysql://localhost:3306/xt_interview?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${XT_DB_USER:root}
spring.datasource.password=${XT_DB_PASS:root}

# Disable SQL logging
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Strict Flyway validation (fail on mismatch)
spring.flyway.validate-on-migrate=true

# Enable static resource caching
spring.web.resources.cache.cachecontrol.max-age=3600

# JWT secret: set XT_JWT_SECRET env var in production
jwt.secret=${XT_JWT_SECRET:xt-interview-secret-key-for-jwt-token-generation-2026}

# Tomcat threads
server.tomcat.threads.min-spare=4
server.tomcat.threads.max=200

# Restrict Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never